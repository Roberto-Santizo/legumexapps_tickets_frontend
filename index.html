<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets TIC · Legumex</title>
  <link rel="icon" type="image/png" href="/marca/legumex-isotipo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tema guardado (claro u oscuro) aplicado antes de pintar, para que no parpadee -->
  <script>try{var t=localStorage.getItem('mt-tema');if(t==='claro'||t==='oscuro')document.documentElement.setAttribute('data-tema',t);}catch(e){}</script>
  <!-- Fase del cielo por la hora de Guatemala (mismos cortes que FASES_CIELO en constantes.js) -->
  <script>try{var g=new Date(Date.now()+(new Date().getTimezoneOffset()-360)*6e4),m=g.getHours()*60+g.getMinutes();document.documentElement.setAttribute('data-fase',m<330?'noche':m<420?'amanecer':m<1035?'dia':m<1125?'atardecer':'noche');}catch(e){}</script>
</head>
<body style="margin:0">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
